name: Apartment monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # "Run workflow" button for manual tests
    inputs:
      debug:
        description: "Debug: list all apartments + save page snapshot to the 'debug' branch (sends nothing)"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit state.json

concurrency:
  group: apartment-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install headless browser
        run: python -m playwright install --with-deps chromium

      - name: Check apartments
        if: ${{ !inputs.debug }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save state
        if: ${{ !inputs.debug }}
        run: |
          git config user.name "apartment-bot"
          git config user.email "apartment-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update apartment state" && git push)

      # ---- debug mode only ----
      - name: Debug - list apartments and capture the page
        if: ${{ inputs.debug }}
        run: |
          python debug_capture.py
          python monitor.py --dump --file network.json | tee dump.txt

      - name: Debug - push snapshot to the "debug" branch
        if: ${{ inputs.debug }}
        run: |
          git config user.name "apartment-bot"
          git config user.email "apartment-bot@users.noreply.github.com"
          git checkout --orphan debug
          git rm -rq --cached .
          git add -f dump.txt rendered.html network.json scripts.json
          git commit -qm "Debug snapshot of the booking page"
          git push -f origin debug
